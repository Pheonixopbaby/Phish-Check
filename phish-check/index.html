<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Phish-Check | URL Risk Analyzer</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --text: #333;
            --primary: #2563eb;
            --danger: #dc2626;
            --success: #16a34a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 1.5rem; }
        .input-group { display: flex; flex-direction: column; gap: 10px; }
        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #result { margin-top: 2rem; display: none; }
        .score-box {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .reasons {
            list-style: none;
            padding: 0;
            font-size: 0.9rem;
        }
        .reasons li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Phish-Check</h1>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste URL here (e.g., http://...)">
            <button onclick="analyzeURL()">Analyze Risk</button>
        </div>
        <div id="result">
            <div id="scoreDisplay" class="score-box"></div>
            <ul id="reasonsList" class="reasons"></ul>
        </div>
    </div>
    <script src="analyzer.js"></script>
</body>
</html>
